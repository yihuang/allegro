[package]
name = "allegro-indexer"
description = "Transaction index maintained by a reth ExEx, served over JSON-RPC"

version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Reth
reth-ethereum = { workspace = true, features = ["node", "exex", "provider"] }
reth-execution-types.workspace = true
reth-node-api.workspace = true
reth-primitives-traits.workspace = true
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-node-core.workspace = true

# Alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true

# Storage
rusqlite = { version = "0.37", features = ["bundled"] }

# General
eyre.workspace = true
futures.workspace = true
# Must match reth's jsonrpsee exactly: the RPC module is merged into reth's server, so
# a different version would be a different (incompatible) set of traits.
jsonrpsee = { version = "0.26.0", features = ["server", "macros"] }
async-trait = "0.1"
parking_lot.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
reth-ethereum-primitives.workspace = true
serde_json.workspace = true
tempfile.workspace = true
