name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  ALLEGRO_LOG_LEVEL: warn

jobs:
  # ── Check compilation with caching ────────────────────────
  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Check workspace
        run: cargo check --workspace --locked

  # ── Tests (unit + integration + process e2e) ──────────────
  test:
    name: test (${{ matrix.partition }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.124

      - name: Install Foundry (for cast in e2e)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build tests
        run: cargo nextest run --profile ci --workspace --partition count:${{ matrix.partition }}/2 --no-run

      - name: Run tests
        run: cargo nextest run --profile ci --workspace --partition count:${{ matrix.partition }}/2

  # ── Formatting ───────────────────────────────────────────
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── Clippy ───────────────────────────────────────────────
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
