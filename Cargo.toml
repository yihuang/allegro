[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
authors = ["Allegro Contributors"]
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = [
  "bin/allegro",
  "crates/primitives",
  "crates/consensus",
  "crates/node",
  "xtask",
]

resolver = "3"

[workspace.dependencies]
allegro-primitives = { path = "crates/primitives", default-features = false }
allegro-consensus = { path = "crates/consensus", default-features = false }
allegro-node = { path = "crates/node", default-features = false }

# ── Commonware ──
commonware-broadcast = "2026.4.0"
commonware-codec = "2026.4.0"
commonware-consensus = "2026.4.0"
commonware-cryptography = "2026.4.0"
commonware-math = "2026.4.0"
commonware-p2p = "2026.4.0"
commonware-parallel = "2026.4.0"
commonware-runtime = "2026.4.0"
commonware-storage = "2026.4.0"
commonware-utils = "2026.4.0"

# ── Alloy ──
alloy-consensus = { version = "2.1.1", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-genesis = { version = "2.1.0", default-features = false }
alloy-rpc-types-engine = { version = "2.1", default-features = false }
bytes = "1.11.1"

# ── General ──
clap = { version = "4.5.57", features = ["derive", "env"] }
eyre = "0.6.12"
futures = "0.3.31"
hex = "0.4.3"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tempfile = "3.24.0"
governor = "0.10.4"
tokio = { version = "1.49.0", features = ["full"] }
rand_08 = { package = "rand", version = "0.8.5" }

# ── Crypto ──
ed25519-consensus = "2.1.0"
rand_core = "0.6.4"

# ── Reth (rev 1bf2384) ──
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-primitives-traits = { version = "0.5.2", default-features = false }
reth-cli = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-cli-runner = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-engine-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-payload-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384" }

[workspace.lints]

[patch.crates-io]
commonware-broadcast = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-codec = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-consensus = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-cryptography = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-macros = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-math = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-p2p = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-parallel = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-resolver = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-storage = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
commonware-utils = { git = "https://github.com/commonwarexyz/monorepo", rev = "2a7dd423f0a241276a5a38db8cc3d05f11de0c03" }
